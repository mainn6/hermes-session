<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRAPI TRADING AGENT</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #ffffff; --text: #101418; --muted: #667080; --faint: #98a1ad; --line: #e8eaed; --chip: #f1f3f5;
    --up: #0a9a68; --up-text: #067a52; --up-soft: rgba(10,154,104,.10); --up-vol: rgba(10,154,104,.30);
    --down: #e5484d; --down-text: #c62f35; --down-soft: rgba(229,72,77,.09); --down-vol: rgba(229,72,77,.28);
    --tag: #101418; --tag-text: #ffffff;
  }
  [data-theme="dark"] {
    --bg: #0c0e11; --text: #eceef1; --muted: #8e97a5; --faint: #6b7482; --line: #21252c; --chip: #171a1f;
    --up: #2fc98e; --up-text: #3dd9a0; --up-soft: rgba(47,201,142,.13); --up-vol: rgba(47,201,142,.34);
    --down: #ff6369; --down-text: #ff7a80; --down-soft: rgba(255,99,105,.12); --down-vol: rgba(255,99,105,.32);
    --tag: #eceef1; --tag-text: #0c0e11;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); }
  body { font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; color: var(--text);
         font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--text); color: var(--bg); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 8px; }
  .page { max-width: 1180px; margin: 0 auto; padding: 28px 28px 56px; }
  .up { color: var(--up-text); } .down { color: var(--down-text); } .muted { color: var(--muted); }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand strong { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .live { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
  .seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .seg button { font-size: 13px; font-weight: 500; color: var(--muted); padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
  .seg button.on { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(16,20,24,.10); }

  .symbols { display: flex; gap: 28px; margin-top: 26px; border-bottom: 1px solid var(--line); }
  .sym { display: flex; align-items: baseline; gap: 10px; padding: 0 2px 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); }
  .sym .s { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .sym .p { font-size: 15px; font-weight: 500; }
  .sym .st { font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .sym.on { color: var(--text); border-bottom-color: var(--text); }
  .sym.on .st.long { background: var(--up-soft); color: var(--up-text); }
  .sym.on .st.short { background: var(--down-soft); color: var(--down-text); }

  .pos { display: grid; grid-template-columns: 1fr auto; column-gap: 32px; row-gap: 18px; align-items: end; padding: 26px 0 22px; }
  .pos-id { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .side { font-size: 12px; font-weight: 700; letter-spacing: .02em; padding: 3px 8px; border-radius: 6px; color: #fff; }
  .side.long { background: var(--up); } .side.short { background: var(--down); }
  .pair { font-size: 17px; font-weight: 700; }
  .when { font-size: 15px; font-weight: 500; }
  .limit { font-size: 13px; color: var(--muted); }
  .pnl-row { display: flex; align-items: baseline; gap: 12px; margin-top: 10px; }
  .pnl { font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .pnl small { font-size: 18px; font-weight: 600; letter-spacing: 0; margin-left: 7px; }
  .pct { font-size: 20px; font-weight: 600; }
  .pnl-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .facts { display: grid; grid-template-columns: repeat(5, auto); column-gap: 34px; }
  .facts div { display: grid; gap: 3px; }
  .facts dt { font-size: 12.5px; color: var(--muted); }
  .facts dd { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .facts dd span { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 5px; }
  .none { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .last { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 15px; }
  .last b { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }

  .chart-box { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .chart-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 4px 16px; }
  .chart-bar .ttl { font-size: 14px; font-weight: 600; }
  .chart-bar .ttl span { color: var(--muted); font-weight: 500; margin-left: 6px; }
  .chart { position: relative; height: 500px; }
  #lw { position: absolute; inset: 0; }
  .ov { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .zone { position: absolute; }
  .zone.tp { background: var(--up-soft); } .zone.sl { background: var(--down-soft); }
  .tag { position: absolute; font-size: 12px; font-weight: 600; line-height: 1; padding: 6px 8px; border-radius: 7px; white-space: nowrap; background: var(--tag); color: var(--tag-text); }
  .tag.gain { background: var(--up); color: #fff; } .tag.loss { background: var(--down); color: #fff; }
  .tag.ghost { background: var(--bg); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
  .ztext { position: absolute; font-size: 12px; font-weight: 600; white-space: nowrap; }

  .grid3 { display: grid; grid-template-columns: 1.35fr .8fr 1.2fr; column-gap: 44px; margin-top: 34px; }
  .block h2 { font-size: 14px; font-weight: 700; padding-bottom: 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .block h2 span { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .row { display: grid; align-items: baseline; gap: 4px 12px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .sig { grid-template-columns: 78px 1fr auto; }
  .sig .nm { font-weight: 600; }
  .sig .stt { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13.5px; }
  .sig .stt i { width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
  .sig .stt.off i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .sig .lastsig { grid-column: 2 / 4; font-size: 13.5px; color: var(--muted); }
  .sig .lastsig b { color: var(--text); font-weight: 600; }
  .sig .cnt { font-size: 13.5px; color: var(--muted); }
  .flow { display: flex; align-items: flex-start; margin-top: 18px; }
  .flow .st { flex: 1; position: relative; font-size: 12.5px; color: var(--muted); padding-top: 14px; }
  .flow .st::before { content: ""; position: absolute; top: 3px; left: 0; right: 0; height: 1px; background: var(--line); }
  .flow .st::after { content: ""; position: absolute; top: 0; left: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--text); }
  .flow .st:last-child::before { display: none; }
  .flow .st b { display: block; color: var(--text); font-size: 13.5px; font-weight: 600; }
  .flow-ttl { font-size: 12.5px; color: var(--muted); margin-top: 18px; }
  .acct { grid-template-columns: 1fr auto; }
  .acct .v { font-weight: 600; font-size: 15.5px; }
  .hist-ttl { font-size: 14px; font-weight: 700; margin-top: 30px; padding-bottom: 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .hist-ttl span { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .hist { grid-template-columns: 92px auto 1fr; font-size: 14px; }
  .hist .t { color: var(--muted); }
  .hist .side { align-self: center; }
  .hist .res { text-align: right; color: var(--muted); }
  .hist .res b { font-weight: 600; }
  .trade { grid-template-columns: auto 1fr auto; }
  .trade .side { align-self: center; }
  .trade .nm { font-weight: 600; }
  .trade .amt { font-weight: 600; text-align: right; }
  .trade .meta { grid-column: 1 / 4; font-size: 13px; color: var(--muted); }

  @media (max-width: 860px) {
    .page { padding: 18px 16px 40px; }
    .symbols { gap: 22px; margin-top: 20px; }
    .pos { grid-template-columns: 1fr; padding: 20px 0 18px; }
    .pnl { font-size: 40px; }
    .facts { grid-template-columns: 1fr 1fr; row-gap: 14px; column-gap: 16px; }
    .facts dd { white-space: normal; }
    .facts dd span.wide { display: block; margin-left: 0; margin-top: 2px; }
    .sym { gap: 8px; flex: 1; min-width: 0; flex-direction: column; align-items: flex-start; white-space: nowrap; } .sym .st.none { display: none; }
    .chart { height: 340px; }
    .chart-bar { flex-wrap: wrap; }
    .grid3 { grid-template-columns: 1fr; row-gap: 30px; margin-top: 28px; }
    .seg button { padding: 6px 10px; }
    .hist { grid-template-columns: 84px 1fr; }
    .hist .res { grid-column: 1 / 3; text-align: left; }
  }
  /* Only the requested theme control and health/stale states extend the approved CSS. */
  #theme-toggle { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #accounts { flex-shrink: 0; font-size: 12px; color: var(--muted); }
  .chart-tools { display: flex; gap: 10px; flex-wrap: wrap; }
  #ohlc { padding: 5px 16px; min-height: 30px; font-size: 12px; color: var(--muted); }
  .live.failed i { background: var(--down); }
  #stale { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--down-text); }
</style>

<div class="app-shell">
  <aside class="sidebar" aria-label="워크스페이스 메뉴">

      <div class="ttl" id="ttl"></div>

<script>
const Q = new URLSearchParams(location.search), KST = 9 * 3600;
const SYMBOLS = ['BTC', 'ETH', 'SOL'];
const VERSION = Q.get('version') === 'v4' || (!Q.has('version') && Q.get('release') === 'v4') ? 'v4' : 'v3', IS_V4 = VERSION === 'v4';
const el = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dp = s => s === 'BTC' ? 1 : 2;
const num = (v, d = 2) => v.toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const sgn = (v, d = 2) => (v >= 0 ? '+' : '−') + num(Math.abs(v), d);
const cls = v => v >= 0 ? 'up' : 'down';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const systemTheme = matchMedia('(prefers-color-scheme: dark)');
let preference = Q.get('theme');
try { preference ||= localStorage.getItem('workspace-theme'); } catch {}
preference ||= 'light';
if (!['light', 'dark'].includes(preference)) preference = null;
let sym = SYMBOLS.includes(Q.get('sym')) ? Q.get('sym') : SYMBOLS[0];
let hours = [1, 3, 6, 24].includes(+Q.get('h')) ? +Q.get('h') : 6;
let interval = [1,5,10].includes(+Q.get('tf')) ? +Q.get('tf') : 1;
let indicatorSeries = [], selectedIndicators = new Set();
try { const saved=JSON.parse(localStorage.getItem('chart-indicators'));if(Array.isArray(saved)) selectedIndicators=new Set(saved.filter(v=>['EMA','SMA','BB','VWAP','RSI','MACD'].includes(v))); } catch {}
let D, C, S, failed = false, refreshing = false, chart, candles, volume, markers, firstBar;
const liveQuotes={};
const hm=t=>new Date((t+KST)*1000).toISOString().slice(11,16);
const last = s => LivePnl.quoteFor(s,liveQuotes,Date.now())?.price??C[s][C[s].length-1][4];
const bars = () => aggregateCandles(C[sym],interval);
function totalPnl() {
  S=D.accounts[sym];
  el('total-pnl').innerHTML=`<div><div class="pos-id"><strong>${sym} 계좌 전체 PnL</strong></div><div class="pnl-row"><div class="pnl ${cls(S.total_pnl)}">${sgn(S.total_pnl)}<small>USDT</small></div><div class="pct ${cls(S.total_pct)}">${sgn(S.total_pct)}%</div></div></div><dl class="facts"><div><dt>실현 손익</dt><dd>${sgn(S.realized)}<span>USDT</span></dd></div><div><dt>미실현 손익</dt><dd>${sgn(S.unrealized)}<span>USDT</span></dd></div><div><dt>현재 평가액</dt><dd>${num(S.equity)}<span>USDT</span></dd></div></dl>`;
}
function status() {
  if(D){el('live').textContent=D.healthy?'정상 운영':'상태 확인 중';el('live').parentElement.classList.toggle('failed',!D.healthy);}
  const age=D?Math.max(0,Date.now()/1000-D.updated):0;
  el('stale').hidden=!failed&&age<=900;
  el('stale').textContent='자료 갱신을 확인하고 있습니다';
}
function header() {
  status();el('accounts').textContent=VERSION.toUpperCase()+' · 모의 운영';
  el('symbols').innerHTML=SYMBOLS.map(s=>`<button class="sym ${s===sym?'on':''}" data-s="${s}" aria-pressed="${s===sym}"><span class="s"><img class="coin-icon" src="coin-${s.toLowerCase()}.${s==='ETH'?'png':'svg'}" alt="">${s}</span><span class="p">${num(last(s),dp(s))}</span></button>`).join('');
  el('symbols').querySelectorAll('button').forEach(b=>b.onclick=()=>{sym=b.dataset.s;firstBar=null;render();});
  document.querySelectorAll('[data-asset]').forEach(b=>{b.classList.toggle('active',b.dataset.asset===sym);b.onclick=()=>{sym=b.dataset.asset;firstBar=null;render();};});
}
function theme() {
  const dark = (preference || (systemTheme.matches ? 'dark' : 'light')) === 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  el('theme-toggle').textContent = dark ? '밝게' : '어둡게';
  el('theme-toggle').setAttribute('aria-label', dark ? '밝은 화면으로 변경' : '어두운 화면으로 변경');
  if (!chart) return;
  chart.applyOptions({layout: {textColor: css('--muted')}, grid: {horzLines: {color: css('--line')}},
    crosshair: {vertLine: {color: css('--faint'), labelBackgroundColor: css('--tag')}, horzLine: {color: css('--faint'), labelBackgroundColor: css('--tag')}}});
  candles.applyOptions({upColor: css('--up'), downColor: css('--down'), wickUpColor: css('--up'), wickDownColor: css('--down')});
  chartData(true);
}
el('theme-toggle').onclick = () => {
  preference = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('workspace-theme', preference); } catch {}
  theme();
};
systemTheme.addEventListener('change', () => { if (!preference) theme(); });
theme();

function renderIndicators(rows) {
  indicatorSeries.reverse().forEach(series=>chart.removeSeries(series));indicatorSeries=[];
  const shift=data=>data.map(p=>({...p,time:p.time+KST}));
  const addLine=(data,color,title,pane=0)=>{
    const series=chart.addSeries(LightweightCharts.LineSeries,{color,lineWidth:1,priceLineVisible:false,lastValueVisible:false,title},pane);
    series.setData(shift(data));indicatorSeries.push(series);return series;
  };
  if(selectedIndicators.has('EMA')){addLine(ema(rows,20),'#ed9b4e','EMA20');addLine(ema(rows,60),'#7d87cf','EMA60');}
  if(selectedIndicators.has('SMA'))addLine(sma(rows,20),'#45a6a0','SMA20');
  if(selectedIndicators.has('BB')){const b=bollinger(rows);addLine(b.upper,'#9faac5','BB상단');addLine(b.middle,'#bac1d3','BB중심');addLine(b.lower,'#9faac5','BB하단');}
  if(selectedIndicators.has('VWAP'))addLine(vwap(rows),'#d688b2','VWAP');
  let pane=1;
  if(selectedIndicators.has('RSI')){
    const series=addLine(rsi(rows),'#9a82c8','RSI14',pane++);series.getPane().setHeight(100);
    series.createPriceLine({price:70,color:'#c4bed0',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'70'});series.createPriceLine({price:30,color:'#c4bed0',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'30'});
  }
  if(selectedIndicators.has('MACD')){
    const data=macd(rows),series=addLine(data.line,'#729bd2','MACD',pane);addLine(data.signal,'#d9a166','Signal',pane);
    const histogram=chart.addSeries(LightweightCharts.HistogramSeries,{priceLineVisible:false,lastValueVisible:false,title:'MACD 히스토그램'},pane++);
    histogram.setData(shift(data.histogram).map(p=>({...p,color:p.value>=0?'#8bd3bb':'#edb3bc'})));indicatorSeries.push(histogram);series.getPane().setHeight(110);
  }
  el('indicators').innerHTML='<span>지표</span>'+['EMA','SMA','BB','VWAP','RSI','MACD'].map(name=>`<button data-indicator="${name}" class="${selectedIndicators.has(name)?'on':''}" aria-pressed="${selectedIndicators.has(name)}">${name==='BB'?'볼린저밴드':name}</button>`).join('');
  el('indicators').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const name=b.dataset.indicator;if(selectedIndicators.has(name))selectedIndicators.delete(name);else selectedIndicators.add(name);
    try{localStorage.setItem('chart-indicators',JSON.stringify([...selectedIndicators]));}catch{}chartData(true);
  });
}

function buildChart() {
  chart = LightweightCharts.createChart(el('lw'), {
    autoSize: true,
    handleScroll: {mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false},
    handleScale: {mouseWheel: true, pinch: true, axisPressedMouseMove: true, axisDoubleClickReset: true},
    layout: {background: {color: 'transparent'}, textColor: css('--muted'), fontFamily: getComputedStyle(document.body).fontFamily, fontSize: 12},
    grid: {vertLines: {visible: false}, horzLines: {color: css('--line')}},
    rightPriceScale: {borderVisible: false, scaleMargins: {top: 0.1, bottom: 0.24}},
    timeScale: {borderVisible: false, timeVisible: true, secondsVisible: false, rightOffset: 8},
    crosshair: {vertLine: {color: css('--faint'), labelBackgroundColor: css('--tag')}, horzLine: {color: css('--faint'), labelBackgroundColor: css('--tag')}},
  });
  candles = chart.addSeries(LightweightCharts.CandlestickSeries, {
    upColor: css('--up'), downColor: css('--down'), borderVisible: false, wickUpColor: css('--up'), wickDownColor: css('--down'),
    priceLineVisible: true, lastValueVisible: true,
  });
  volume = chart.addSeries(LightweightCharts.HistogramSeries, {priceScaleId: 'vol', priceFormat: {type: 'volume'}, priceLineVisible: false, lastValueVisible: false});
  chart.priceScale('vol').applyOptions({scaleMargins: {top: 0.84, bottom: 0}});
  markers=LightweightCharts.createSeriesMarkers(candles,[]);
  chart.subscribeCrosshairMove(event => {
    const value = event.seriesData.get(candles), row = bars().at(-1);
    const b = value || {open:row[1],high:row[2],low:row[3],close:row[4]};
    el('ohlc').textContent = `O ${num(b.open,dp(sym))}   H ${num(b.high,dp(sym))}   L ${num(b.low,dp(sym))}   C ${num(b.close,dp(sym))} · UTC+9`;
  });
}


function applyRange() {
  if (!C) return;
  chart.priceScale('right').applyOptions({autoScale: true});
  const rows = bars(), count = hours * 60 / interval, future = Math.round(count * .04);
  chart.timeScale().setVisibleLogicalRange({from: rows.length - count, to: rows.length - 1 + future});
}

function chartData(preserve = false) {
  const d = dp(sym), rows = bars(), previous = preserve && chart.timeScale().getVisibleLogicalRange();
  const shift = firstBar == null ? 0 : (firstBar - rows[0][0]) / (interval * 60);
  firstBar = rows[0][0];
  candles.applyOptions({priceFormat: {type: 'price', precision: d, minMove: d === 1 ? .1 : .01}});
  candles.setData(rows.map(r => ({time: r[0] + KST, open: r[1], high: r[2], low: r[3], close: r[4]})));
  volume.setData(rows.map(r => ({time: r[0] + KST, value: r[5], color: r[4] >= r[1] ? css('--up-vol') : css('--down-vol')})));
  renderIndicators(rows);
  const bucket=t=>Math.floor(t/(interval*60))*interval*60+KST;
  markers.setMarkers(D.entries.filter(e=>e.symbol===sym&&bucket(e.time)>=rows[0][0]+KST&&bucket(e.time)<=rows.at(-1)[0]+KST).map(e=>({time:bucket(e.time),position:e.side==='long'?'belowBar':'aboveBar',shape:e.side==='long'?'arrowUp':'arrowDown',color:css(e.side==='long'?'--up':'--down'),text:`${e.side==='long'?'롱':'숏'} 진입 ${hm(e.time)} · ${num(e.price,dp(sym))}`})).sort((a,b)=>a.time-b.time));
  if (previous) chart.timeScale().setVisibleLogicalRange({from:previous.from+shift,to:previous.to+shift});
  else applyRange();
  el('ttl').innerHTML = `${sym}/USDT<span>${interval}분봉 · TradingView</span>`;
  const latestBar = rows.at(-1);
  el('ohlc').textContent = `O ${num(latestBar[1],d)}   H ${num(latestBar[2],d)}   L ${num(latestBar[3],d)}   C ${num(latestBar[4],d)} · 거래량 ${num(latestBar[5],0)}`;
  el('intervals').innerHTML = [1,5,10].map(n=>`<button class="${n===interval?'on':''}" data-min="${n}" aria-pressed="${n===interval}">${n}분봉</button>`).join('');
  el('intervals').querySelectorAll('button').forEach(b=>b.onclick=()=>{interval=+b.dataset.min;firstBar=null;chartData();});
  el('ranges').innerHTML = [1, 3, 6, 24].map(h => `<button class="${h === hours ? 'on' : ''}" data-h="${h}" aria-pressed="${h === hours}">${h}시간</button>`).join('');
  el('ranges').querySelectorAll('button').forEach(b => b.onclick = () => { hours = +b.dataset.h; chartData(); });
  el('reset-view').onclick=()=>{applyRange();};
}


function render(preserve=false){header();totalPnl();if(!chart)buildChart();chartData(preserve);}
function validate(data,rows){
  const keys=(value,wanted)=>value&&typeof value==='object'&&!Array.isArray(value)&&Object.keys(value).sort().join(',')===[...wanted].sort().join(',');
  if(!keys(data,['visibility','version','updated','healthy','accounts','entries'])||data.visibility!=='public-summary'||data.version!==VERSION||!Number.isFinite(data.updated)||typeof data.healthy!=='boolean'||!keys(data.accounts,SYMBOLS)||!keys(rows,SYMBOLS))throw Error('invalid public summary');
  if(!Array.isArray(data.entries)||!data.entries.every(e=>keys(e,['symbol','side','time','price'])&&SYMBOLS.includes(e.symbol)&&['long','short'].includes(e.side)&&Number.isFinite(e.time)&&e.time>0&&Number.isFinite(e.price)&&e.price>0))throw Error('invalid public entries');
  for(const s of SYMBOLS){
    const a=data.accounts[s],fields=['equity','realized','unrealized','total_pnl','total_pct'];
    if(!keys(a,fields)||!fields.every(k=>Number.isFinite(a[k]))||Math.abs(a.total_pnl-a.realized-a.unrealized)>.021)throw Error('invalid public totals');
    if(!Array.isArray(rows[s])||!rows[s].length||!rows[s].every((r,i)=>Array.isArray(r)&&r.length===6&&r.every(Number.isFinite)&&r[0]>0&&Math.min(...r.slice(1,5))>0&&r[5]>=0&&r[3]<=Math.min(r[1],r[4])&&r[2]>=Math.max(r[1],r[4])&&(!i||r[0]-rows[s][i-1][0]===60)))throw Error('invalid market candles');
  }
}
async function refresh(){
  if(refreshing)return;refreshing=true;
  try{
    const stamp=Date.now();
    const [data,rows]=await Promise.all((IS_V4?['v4-data.json','v4-candles.json']:['data.json','candles.json']).map(async name=>{
      const response=await fetch(`${name}?v=${stamp}`,{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!response.ok)throw Error('fetch failed');return response.json();
    }));
    validate(data,rows);D=data;C=rows;failed=false;render(true);
  }catch{failed=true;}finally{refreshing=false;status();}
}
function versionUrl(version){const u=new URL(location.href);u.searchParams.set('version',version);u.hash='';return u;}
for(const group of document.querySelectorAll('.version-category')){
  const active=group.dataset.version===VERSION;group.open=active;
  group.querySelectorAll('[data-section]').forEach(a=>{const u=versionUrl(group.dataset.version);u.hash=a.dataset.section;a.href=u;a.classList.toggle('active',active&&a.dataset.section==='#overview');});
  group.addEventListener('toggle',()=>{if(group.open&&group.dataset.version!==VERSION)location.href=versionUrl(group.dataset.version);});
}
for(const a of document.querySelectorAll('.version-switch a')){a.href=versionUrl(a.dataset.version);if(a.dataset.version===VERSION)a.setAttribute('aria-current','page');}
document.querySelector('.breadcrumbs strong').textContent=VERSION.toUpperCase()+' 운영 현황';
document.querySelectorAll('.side-nav a').forEach(a=>a.addEventListener('click',()=>{document.querySelectorAll('.side-nav a').forEach(n=>n.classList.remove('active'));a.classList.add('active');}));
refresh();LivePnl.feed(q=>{liveQuotes[q.symbol]=q;},()=>{});
setInterval(()=>{if(D&&C)header();},1000);setInterval(refresh,10000);setInterval(status,10000);
</script>
</body>
