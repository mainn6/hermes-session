<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRAPI TRADING AGENT</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #ffffff; --text: #101418; --muted: #667080; --faint: #98a1ad; --line: #e8eaed; --chip: #f1f3f5;
    --up: #0a9a68; --up-text: #067a52; --up-soft: rgba(10,154,104,.10); --up-vol: rgba(10,154,104,.30);
    --down: #e5484d; --down-text: #c62f35; --down-soft: rgba(229,72,77,.09); --down-vol: rgba(229,72,77,.28);
    --tag: #101418; --tag-text: #ffffff;
  }
  [data-theme="dark"] {
    --bg: #0c0e11; --text: #eceef1; --muted: #8e97a5; --faint: #6b7482; --line: #21252c; --chip: #171a1f;
    --up: #2fc98e; --up-text: #3dd9a0; --up-soft: rgba(47,201,142,.13); --up-vol: rgba(47,201,142,.34);
    --down: #ff6369; --down-text: #ff7a80; --down-soft: rgba(255,99,105,.12); --down-vol: rgba(255,99,105,.32);
    --tag: #eceef1; --tag-text: #0c0e11;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); }
  body { font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; color: var(--text);
         font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--text); color: var(--bg); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 8px; }
  .page { max-width: 1180px; margin: 0 auto; padding: 28px 28px 56px; }
  .up { color: var(--up-text); } .down { color: var(--down-text); } .muted { color: var(--muted); }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand strong { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .live { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
  .seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .seg button { font-size: 13px; font-weight: 500; color: var(--muted); padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
  .seg button.on { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(16,20,24,.10); }

  .symbols { display: flex; gap: 28px; margin-top: 26px; border-bottom: 1px solid var(--line); }
  .sym { display: flex; align-items: baseline; gap: 10px; padding: 0 2px 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); }
  .sym .s { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .sym .p { font-size: 15px; font-weight: 500; }
  .sym .st { font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .sym.on { color: var(--text); border-bottom-color: var(--text); }
  .sym.on .st.long { background: var(--up-soft); color: var(--up-text); }
  .sym.on .st.short { background: var(--down-soft); color: var(--down-text); }

  .pos { display: grid; grid-template-columns: 1fr auto; column-gap: 32px; row-gap: 18px; align-items: end; padding: 26px 0 22px; }
  .pos-id { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .side { font-size: 12px; font-weight: 700; letter-spacing: .02em; padding: 3px 8px; border-radius: 6px; color: #fff; }
  .side.long { background: var(--up); } .side.short { background: var(--down); }
  .pair { font-size: 17px; font-weight: 700; }
  .when { font-size: 15px; font-weight: 500; }
  .limit { font-size: 13px; color: var(--muted); }
  .pnl-row { display: flex; align-items: baseline; gap: 12px; margin-top: 10px; }
  .pnl { font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .pnl small { font-size: 18px; font-weight: 600; letter-spacing: 0; margin-left: 7px; }
  .pct { font-size: 20px; font-weight: 600; }
  .pnl-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .facts { display: grid; grid-template-columns: repeat(5, auto); column-gap: 34px; }
  .facts div { display: grid; gap: 3px; }
  .facts dt { font-size: 12.5px; color: var(--muted); }
  .facts dd { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .facts dd span { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 5px; }
  .none { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .last { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 15px; }
  .last b { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }

  .chart-box { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .chart-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 4px 16px; }
  .chart-bar .ttl { font-size: 14px; font-weight: 600; }
  .chart-bar .ttl span { color: var(--muted); font-weight: 500; margin-left: 6px; }
  .chart { position: relative; height: 500px; }
  #lw { position: absolute; inset: 0; }
  .ov { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .zone { position: absolute; }
  .zone.tp { background: var(--up-soft); } .zone.sl { background: var(--down-soft); }
  .tag { position: absolute; font-size: 12px; font-weight: 600; line-height: 1; padding: 6px 8px; border-radius: 7px; white-space: nowrap; background: var(--tag); color: var(--tag-text); }
  .tag.gain { background: var(--up); color: #fff; } .tag.loss { background: var(--down); color: #fff; }
  .tag.ghost { background: var(--bg); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
  .ztext { position: absolute; font-size: 12px; font-weight: 600; white-space: nowrap; }

  .grid3 { display: grid; grid-template-columns: 1.35fr .8fr 1.2fr; column-gap: 44px; margin-top: 34px; }
  .block h2 { font-size: 14px; font-weight: 700; padding-bottom: 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .block h2 span { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .row { display: grid; align-items: baseline; gap: 4px 12px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .sig { grid-template-columns: 78px 1fr auto; }
  .sig .nm { font-weight: 600; }
  .sig .stt { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13.5px; }
  .sig .stt i { width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
  .sig .stt.off i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .sig .lastsig { grid-column: 2 / 4; font-size: 13.5px; color: var(--muted); }
  .sig .lastsig b { color: var(--text); font-weight: 600; }
  .sig .cnt { font-size: 13.5px; color: var(--muted); }
  .flow { display: flex; align-items: flex-start; margin-top: 18px; }
  .flow .st { flex: 1; position: relative; font-size: 12.5px; color: var(--muted); padding-top: 14px; }
  .flow .st::before { content: ""; position: absolute; top: 3px; left: 0; right: 0; height: 1px; background: var(--line); }
  .flow .st::after { content: ""; position: absolute; top: 0; left: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--text); }
  .flow .st:last-child::before { display: none; }
  .flow .st b { display: block; color: var(--text); font-size: 13.5px; font-weight: 600; }
  .flow-ttl { font-size: 12.5px; color: var(--muted); margin-top: 18px; }
  .acct { grid-template-columns: 1fr auto; }
  .acct .v { font-weight: 600; font-size: 15.5px; }
  .hist-ttl { font-size: 14px; font-weight: 700; margin-top: 30px; padding-bottom: 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .hist-ttl span { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .hist { grid-template-columns: 92px auto 1fr; font-size: 14px; }
  .hist .t { color: var(--muted); }
  .hist .side { align-self: center; }
  .hist .res { text-align: right; color: var(--muted); }
  .hist .res b { font-weight: 600; }
  .trade { grid-template-columns: auto 1fr auto; }
  .trade .side { align-self: center; }
  .trade .nm { font-weight: 600; }
  .trade .amt { font-weight: 600; text-align: right; }
  .trade .meta { grid-column: 1 / 4; font-size: 13px; color: var(--muted); }

  @media (max-width: 860px) {
    .page { padding: 18px 16px 40px; }
    .symbols { gap: 22px; margin-top: 20px; }
    .pos { grid-template-columns: 1fr; padding: 20px 0 18px; }
    .pnl { font-size: 40px; }
    .facts { grid-template-columns: 1fr 1fr; row-gap: 14px; column-gap: 16px; }
    .facts dd { white-space: normal; }
    .facts dd span.wide { display: block; margin-left: 0; margin-top: 2px; }
    .sym { gap: 8px; flex: 1; min-width: 0; flex-direction: column; align-items: flex-start; white-space: nowrap; } .sym .st.none { display: none; }
    .chart { height: 340px; }
    .chart-bar { flex-wrap: wrap; }
    .grid3 { grid-template-columns: 1fr; row-gap: 30px; margin-top: 28px; }
    .seg button { padding: 6px 10px; }
    .hist { grid-template-columns: 84px 1fr; }
    .hist .res { grid-column: 1 / 3; text-align: left; }
  }
  /* Only the requested theme control and health/stale states extend the approved CSS. */
  #theme-toggle { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #accounts { flex-shrink: 0; }
  .live.failed i { background: var(--down); }
  #stale { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--down-text); }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand"><strong>KRAPI TRADING AGENT</strong><span class="live"><i></i><span id="live" role="status">자료 불러오는 중</span></span><button id="theme-toggle" aria-label="화면 테마 변경"></button></div>
    <div class="seg" id="accounts" aria-label="계좌"><button data-account="paper">모의</button><button data-account="practice">LBank 연습</button></div>
  </header>
  <div id="stale" role="status" hidden></div>
  <nav class="symbols" id="symbols" aria-label="종목"></nav>
  <section class="pos" id="pos" aria-label="지금 포지션"><div class="muted">자료 불러오는 중</div></section>
  <section class="chart-box" aria-label="차트">
    <div class="chart-bar">
      <div class="ttl" id="ttl"></div>
      <div class="seg" id="ranges" aria-label="범위"></div>
    </div>
    <div class="chart"><div id="lw"></div><div class="ov" id="ov"></div></div>
  </section>
  <section class="grid3">
    <div class="block"><h2>신호 수신 <span id="sigsum"></span></h2><div id="signals"></div></div>
    <div class="block"><h2>계좌</h2><div id="account"></div></div>
    <div class="block"><h2>최근 거래 <span id="tradesum"></span></h2><div id="trades"></div></div>
  </section>
</div>
<script src="lwc.js"></script>
<script>
const Q = new URLSearchParams(location.search), KST = 9 * 3600;
const SYMBOLS = ['SOL', 'BTC', 'ETH'];
const el = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dp = s => s === 'BTC' ? 1 : 2;
const num = (v, d = 2) => v.toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const sgn = (v, d = 2) => (v >= 0 ? '+' : '−') + num(Math.abs(v), d);
const hm = t => t ? new Date((t + KST) * 1000).toISOString().slice(11, 16) : '—';
const ago = s => s < 3600 ? Math.max(1, Math.round(Math.max(0, s) / 60)) + '분' : Math.floor(s / 3600) + '시간 ' + Math.round(s % 3600 / 60) + '분';
const cls = v => v >= 0 ? 'up' : 'down';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const systemTheme = matchMedia('(prefers-color-scheme: dark)');
let preference = Q.get('theme');
try { preference ||= localStorage.getItem('theme'); } catch {}
if (!['light', 'dark'].includes(preference)) preference = null;
let sym = SYMBOLS.includes(Q.get('sym')) ? Q.get('sym') : SYMBOLS[0];
let hours = [1, 3, 6, 24].includes(+Q.get('h')) ? +Q.get('h') : 3;
let account = Q.get('account') === 'practice' ? 'practice' : 'paper';
let D, C, S, failed = false, refreshing = false, chart, candles, volume, markers, lines = [], firstBar;
const pos = () => S.positions.find(p => p.symbol === sym);
const last = s => D.marks[s] || C[s][C[s].length - 1][4];

function theme() {
  const dark = (preference || (systemTheme.matches ? 'dark' : 'light')) === 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  el('theme-toggle').textContent = dark ? '밝게' : '어둡게';
  el('theme-toggle').setAttribute('aria-label', dark ? '밝은 화면으로 변경' : '어두운 화면으로 변경');
  if (!chart) return;
  chart.applyOptions({layout: {textColor: css('--muted')}, grid: {horzLines: {color: css('--line')}},
    crosshair: {vertLine: {color: css('--faint'), labelBackgroundColor: css('--tag')}, horzLine: {color: css('--faint'), labelBackgroundColor: css('--tag')}}});
  candles.applyOptions({upColor: css('--up'), downColor: css('--down'), wickUpColor: css('--up'), wickDownColor: css('--down')});
  chartData(true);
}
el('theme-toggle').onclick = () => {
  preference = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', preference); } catch {}
  theme();
};
systemTheme.addEventListener('change', () => { if (!preference) theme(); });
theme();

function status() {
  if (D) {
    const h = D.health;
    el('live').textContent = h.down.length ? `${h.ok} / ${h.total} · 멈춤: ${h.down.join(', ')}` : `${h.ok} / ${h.total} 정상 · ${hm(D.updated)} 갱신 · UTC+9`;
    el('live').parentElement.classList.toggle('failed', h.down.length > 0);
  }
  const age = D ? Math.max(0, Date.now() / 1000 - D.updated) : 0;
  el('stale').hidden = !failed && age <= 900;          // the page is published every 5 minutes; 15 minutes without an update means something stopped
  el('stale').textContent = D ? `자료가 ${Math.max(failed ? 1 : 0, Math.floor(age / 60))}분째 갱신되지 않았습니다` : '자료를 불러오지 못했습니다 · 다음 갱신 때 다시 확인합니다';
}

function header() {
  status();
  el('accounts').querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.account === account);
    b.setAttribute('aria-pressed', String(b.dataset.account === account));
    b.onclick = () => { account = b.dataset.account; render(true); };
  });
  el('symbols').innerHTML = SYMBOLS.map(s => {
    const p = S.positions.find(p => p.symbol === s);
    const st = p ? `<span class="st ${esc(p.side)}">${esc(p.side.toUpperCase())} 보유</span>` : '<span class="st none">포지션 없음</span>';
    return `<button class="sym ${s === sym ? 'on' : ''}" data-s="${s}" aria-pressed="${s === sym}"><span class="s">${s}</span><span class="p">${num(last(s), dp(s))}</span>${st}</button>`;
  }).join('');
  el('symbols').querySelectorAll('button').forEach(b => b.onclick = () => { sym = b.dataset.s; render(); });
}

function position() {
  const p = pos(), d = dp(sym);
  if (!p) {
    const c = S.closed.find(t => t.symbol === sym);
    const empty = account === 'practice' ? `연습 주문 ${(S.orders || []).filter(o => o.symbol === sym).length}건 기록 · 체결 없음` : '다음 신호 대기 중';
    el('pos').innerHTML = `<div><div class="none">지금 ${sym} 포지션 없음</div><div class="pnl-sub">${empty}</div>` + (c ?
      `<div class="last"><span class="side ${esc(c.side)}">${esc(c.side.toUpperCase())}</span><span>직전 거래 ${hm(c.opened_at)} → ${hm(c.closed_at)} · ${esc(c.reason)}</span><b class="${cls(c.pnl)}">${sgn(c.pnl)} USDT</b><span class="${cls(c.pnl)}">${sgn(c.pnl_pct)}%</span></div>` : '') + '</div>';
    return;
  }
  const left = p.max_hold_at - S.now, limit = p.max_hold_at - p.opened_at;
  el('pos').innerHTML = `
    <div>
      <div class="pos-id"><span class="side ${esc(p.side)}">${esc(p.side.toUpperCase())}</span><span class="pair">${sym}/USDT</span>
        <span class="when">${hm(p.opened_at)} 진입 · ${ago(S.now - p.opened_at)} 전</span><span class="limit">${limit % 3600 ? num(limit / 60, 0) + '분' : num(limit / 3600, 0) + '시간'} 한도 · ${left > 0 ? ago(left) + ' 남음' : '청산 대기'}</span></div>
      <div class="pnl-row"><div class="pnl ${cls(p.pnl)}">${sgn(p.pnl)}<small>USDT</small></div><div class="pct ${cls(p.pnl)}">${sgn(p.pnl_pct)}%</div></div>
      <div class="pnl-sub">미실현 손익 · 계좌 대비 ${S.equity ? sgn(p.pnl / S.equity * 100) + '%' : '—'}</div>
    </div>
    <dl class="facts">
      <div><dt>평균 진입가</dt><dd>${num(p.entry, d)}</dd></div>
      <div><dt>현재가</dt><dd>${num(p.mark, d)}</dd></div>
      <div><dt>수량</dt><dd>${num(p.size)}<span>${sym}</span></dd></div>
      <div><dt>금액</dt><dd>${num(p.notional)}<span>USDT</span><span class="wide">계좌의 ${num(p.leverage)}배</span></dd></div>
      <div><dt>물타기</dt><dd>${p.ladder_filled} / ${p.ladder_steps}<span>체결</span></dd></div>
    </dl>`;
}

function buildChart() {
  chart = LightweightCharts.createChart(el('lw'), {
    autoSize: true,
    handleScroll: false, handleScale: false,
    layout: {background: {color: 'transparent'}, textColor: css('--muted'), fontFamily: getComputedStyle(document.body).fontFamily, fontSize: 12},
    grid: {vertLines: {visible: false}, horzLines: {color: css('--line')}},
    rightPriceScale: {borderVisible: false, scaleMargins: {top: 0.1, bottom: 0.24}},
    timeScale: {borderVisible: false, timeVisible: true, secondsVisible: false, rightOffset: 8},
    crosshair: {vertLine: {color: css('--faint'), labelBackgroundColor: css('--tag')}, horzLine: {color: css('--faint'), labelBackgroundColor: css('--tag')}},
  });
  candles = chart.addSeries(LightweightCharts.CandlestickSeries, {
    upColor: css('--up'), downColor: css('--down'), borderVisible: false, wickUpColor: css('--up'), wickDownColor: css('--down'),
    priceLineVisible: false, lastValueVisible: false,
    autoscaleInfoProvider: original => {
      const r = original(), p = pos();
      if (!r || !p) return r;
      const levels = [p.entry, p.target, p.stop].filter(v => v > 0), pad = (Math.max(...levels) - Math.min(...levels)) * .06;
      r.priceRange.minValue = Math.min(r.priceRange.minValue, Math.min(...levels) - pad);
      r.priceRange.maxValue = Math.max(r.priceRange.maxValue, Math.max(...levels) + pad);
      return r;
    },
  });
  volume = chart.addSeries(LightweightCharts.HistogramSeries, {priceScaleId: 'vol', priceFormat: {type: 'volume'}, priceLineVisible: false, lastValueVisible: false});
  chart.priceScale('vol').applyOptions({scaleMargins: {top: 0.84, bottom: 0}});
  markers = LightweightCharts.createSeriesMarkers(candles, []);
  chart.timeScale().subscribeVisibleLogicalRangeChange(overlay);
  new ResizeObserver(() => requestAnimationFrame(() => { applyRange(); overlay(); })).observe(el('lw'));
}

function applyRange() {
  if (!C) return;
  const rows = C[sym], bars = hours * 60, future = Math.round(bars * (pos() ? .32 : .04));
  chart.timeScale().setVisibleLogicalRange({from: rows.length - bars, to: rows.length - 1 + future});
}

function chartData(preserve = false) {
  const d = dp(sym), rows = C[sym], p = pos(), previous = preserve && chart.timeScale().getVisibleLogicalRange();
  const shift = firstBar == null ? 0 : (firstBar - rows[0][0]) / 60;
  firstBar = rows[0][0];
  candles.applyOptions({priceFormat: {type: 'price', precision: d, minMove: d === 1 ? .1 : .01}});
  candles.setData(rows.map(r => ({time: r[0] + KST, open: r[1], high: r[2], low: r[3], close: r[4]})));
  volume.setData(rows.map(r => ({time: r[0] + KST, value: r[5], color: r[4] >= r[1] ? css('--up-vol') : css('--down-vol')})));
  lines.forEach(l => candles.removePriceLine(l)); lines = [];
  const L = LightweightCharts.LineStyle;
  const line = (price, color, style, axis = true) => { if (price > 0) lines.push(candles.createPriceLine({price, color, lineWidth: 1, lineStyle: style, axisLabelVisible: axis, title: ''})); };
  const m = [], bar = t => Math.floor(t / 60) * 60 + KST;
  const ordered = t => {
    const up = t.side === 'long';
    if (t.signal_time) m.push({time: bar(t.signal_time), position: 'aboveBar', shape: 'circle', color: css('--faint'), text: hours <= 3 ? '신호' : '', size: .6});
    m.push({time: bar(t.opened_at), position: up ? 'belowBar' : 'aboveBar', shape: up ? 'arrowUp' : 'arrowDown', color: css(up ? '--up' : '--down'), text: hours <= 3 ? '진입 ' + hm(t.opened_at) : ''});
  };
  if (p) {
    line(p.target, css('--up'), L.Dashed); line(p.entry, css('--text'), L.Solid);
    p.pending.forEach(v => line(v, css('--faint'), L.Dotted, false));
    line(p.stop, css('--down'), L.Dashed);
    ordered(p);
  }
  (S.orders || []).filter(o => o.symbol === sym).forEach(o => line(o.price, css('--faint'), L.Dotted));
  (D.signals.dots || []).filter(s => s.symbol === sym).forEach(s => m.push({time: bar(s.time), position: 'aboveBar', shape: 'circle', color: css('--faint'), text: '', size: .4}));
  S.closed.filter(t => t.symbol === sym).forEach(t => {
    ordered(t);
    m.push({time: bar(t.closed_at), position: t.side === 'long' ? 'aboveBar' : 'belowBar', shape: t.side === 'long' ? 'arrowDown' : 'arrowUp', color: css(t.pnl >= 0 ? '--up' : '--down'), text: hours <= 3 ? t.reason + ' ' + hm(t.closed_at) : ''});
  });
  markers.setMarkers(m.filter(m => m.time >= rows[0][0] + KST && m.time <= rows[rows.length - 1][0] + KST).sort((a, b) => a.time - b.time));
  applyRange();
  el('ttl').innerHTML = `${sym}/USDT<span>1분 · 거래량</span>`;
  el('ranges').innerHTML = [1, 3, 6, 24].map(h => `<button class="${h === hours ? 'on' : ''}" data-h="${h}" aria-pressed="${h === hours}">${h}시간</button>`).join('');
  el('ranges').querySelectorAll('button').forEach(b => b.onclick = () => { hours = +b.dataset.h; chartData(); });
  requestAnimationFrame(overlay);
}

function overlay() {
  if (!S || !C || firstBar == null) return;
  const ov = el('ov'), ts = chart.timeScale(), p = pos(), W = ts.width(), out = [];
  const x = t => ts.logicalToCoordinate((Math.floor(t / 60) * 60 - firstBar) / 60), y = v => v > 0 ? candles.priceToCoordinate(v) : null;
  const zone = (c, x0, x1, a, b) => {
    if (x0 == null || x1 == null || a == null || b == null) return;
    const l = Math.max(0, x0), r = Math.min(W, x1);
    if (r > l) out.push(`<div class="zone ${c}" style="left:${l}px;width:${r - l}px;top:${Math.min(a, b)}px;height:${Math.abs(a - b)}px"></div>`);
  };
  if (p) {
    const x0 = x(p.opened_at), x1 = x(S.now - 60), up = p.side === 'long', d = dp(sym);
    const yE = y(p.entry), yT = y(p.target), yS = y(p.stop), pct = v => sgn((v / p.entry - 1) * 100 * (up ? 1 : -1));
    zone('tp', x0, W, yE, yT); zone('sl', x0, W, yE, yS);
    if (W < 520) out.push(`<div class="tag ${p.pnl >= 0 ? 'gain' : 'loss'}" style="left:10px;top:10px">${esc(p.side.toUpperCase())} · ${sgn(p.pnl)} USDT · ${sgn(p.pnl_pct)}%</div>`);
    else if (x0 != null && yE != null) {
      if (yT != null) out.push(`<div class="ztext up" style="left:${W - 10}px;top:${up ? Math.min(yE, yT) + 8 : Math.max(yE, yT) - 24}px;transform:translateX(-100%)">익절 ${pct(p.target)}%</div>`);
      if (yS != null) out.push(`<div class="ztext down" style="left:${W - 10}px;top:${up ? Math.max(yE, yS) - 24 : Math.min(yE, yS) + 8}px;transform:translateX(-100%)">손절 ${pct(p.stop)}%</div>`);
      out.push(`<div class="tag" style="left:${W - 8}px;top:${yE - 12}px;transform:translateX(-100%)">${esc(p.side.toUpperCase())} ${num(p.size)} ${sym} · ${num(p.notional)} USDT</div>`);
      if (p.pending.length > 1) {
        const ys = p.pending.map(y), top = up ? Math.max(...ys) + 4 : Math.min(...ys) - 28;
        out.push(`<div class="tag ghost" style="right:${ov.clientWidth - W + 8}px;top:${top}px">물타기 대기 ${p.pending.map(v => num(v, d)).join(' · ')}</div>`);
      } else p.pending.forEach(v => out.push(`<div class="tag ghost" style="left:${Math.max(8, x0 + 8) + 150}px;top:${y(v) + (up ? 4 : -28)}px">물타기 대기 ${num(v, d)}</div>`));
    }
    if (x1 != null && W >= 520) out.push(`<div class="tag ${p.pnl >= 0 ? 'gain' : 'loss'}" style="left:${x1 + 18}px;top:${y(p.mark) + (p.pnl >= 0 ? -30 : 6)}px">${sgn(p.pnl)} USDT · ${sgn(p.pnl_pct)}%</div>`);
  }
  let mobileRow = p ? 1 : 0;
  S.closed.filter(t => t.symbol === sym).forEach(t => {
    const x0 = x(t.opened_at), x1 = x(t.closed_at);
    if (x0 == null || x1 == null || x0 > W || x1 < 0) return;
    zone('tp', x0, x1, y(t.entry), y(t.target)); zone('sl', x0, x1, y(t.entry), y(t.stop));
    const res = `${esc(t.reason)} ${hm(t.closed_at)} · ${sgn(t.pnl)} USDT · ${sgn(t.pnl_pct)}%`, c = t.pnl >= 0 ? 'gain' : 'loss';
    if (W < 520) out.push(`<div class="tag ${c}" data-closed style="left:10px;top:${10 + mobileRow++ * 28}px">${res}</div>`);
    else {
      const top = Math.max(4, Math.min(...[y(t.entry), y(t.target), y(t.stop), y(t.exit)].filter(v => v != null)) - 30);
      const text = x1 - x0 < 40 ? `${sgn(t.pnl)}` : res;                         // narrow zone (long ranges): the amount only
      if (x0 > W - 260) out.push(`<div class="tag ${c}" data-closed style="left:${Math.min(W - 8, Math.max(x1, x0 + 4))}px;top:${top}px;transform:translateX(-100%)">${text}</div>`);
      else out.push(`<div class="tag ${c}" data-closed style="left:${Math.max(4, x0)}px;top:${top}px">${text}</div>`);
    }
  });
  ov.innerHTML = out.join('');
}

const dhm = t => { const d = new Date((t + KST) * 1000).toISOString(); return `${+d.slice(5, 7)}/${+d.slice(8, 10)} ${d.slice(11, 16)}`; };
function history() {                                  // every signal that reached the bot, newest first
  const h = D.signals.history || [];
  if (!h.length) return '';
  return `<div class="hist-ttl">신호 기록 <span>${h.length}건</span></div>` + h.map(r => {
    const end = r.pnl != null ? ` · ${esc(r.outcome)} <b class="${cls(r.pnl)}">${sgn(r.pnl)} USDT</b>` : r.outcome ? ` · ${esc(r.outcome)}` : '';
    return `<div class="row hist"><span class="t">${dhm(r.time)}</span><span><span class="side ${esc(r.side)}">${esc(r.side.toUpperCase())}</span> <b>${esc(r.symbol)}</b></span><span class="res">${esc(r.result)}${end}</span></div>`;
  }).join('');
}

function lower() {
  const rows = D.signals.rows;
  el('sigsum').textContent = `${rows.filter(r => r.on).length} / ${rows.length} 수신 중`;
  el('signals').innerHTML = rows.map(r => {
    const chk = r.state || (r.checked_at ? (S.now - r.checked_at < 60 ? '방금 확인' : `${ago(S.now - r.checked_at)} 전 확인`) : '확인 전');
    const last = r.last ? `<b>${hm(r.last.time)} ${esc(r.last.side.toUpperCase())}</b> → ${esc(r.last.result)}${r.last.result_time ? ' ' + hm(r.last.result_time) : ''}` : '아직 신호 없음';
    return `<div class="row sig"><span class="nm">${esc(r.name)}</span><span class="stt ${r.on ? '' : 'off'}"><i></i>${r.state ? '' : r.on ? '수신 중 · ' : '멈춤 · '}${esc(chk)}</span><span class="cnt">${r.today == null ? '' : '오늘 ' + r.today + '건'}</span>${r.today == null ? '' : `<span class="lastsig">마지막 ${last}</span>`}</div>`;
  }).join('') + (D.signals.flow.length ? '<div class="flow-ttl">마지막 신호가 지나간 길</div><div class="flow">' + D.signals.flow.map(r => `<div class="st"><b>${esc(r.step)}</b>${hm(r.time)}</div>`).join('') + '</div>' : '') + history();
  el('account').innerHTML = [['평가액', num(S.equity) + ' USDT', ''], ['오늘 손익', sgn(S.day_pnl) + ' USDT', cls(S.day_pnl)], ['누적 실현 손익', sgn(S.realized) + ' USDT', cls(S.realized)], ['거래', `${S.trades}건 · ${S.wins}승`, '']]
    .map(([k, v, c]) => `<div class="row acct"><span class="muted">${k}</span><span class="v ${c}">${v}</span></div>`).join('');
  el('tradesum').textContent = `${S.trades}건`;
  el('trades').innerHTML = S.closed.map(t => `<div class="row trade"><span class="side ${esc(t.side)}">${esc(t.side.toUpperCase())}</span><span class="nm">${esc(t.symbol)}</span><span class="amt ${cls(t.pnl)}">${sgn(t.pnl)} USDT · ${sgn(t.pnl_pct)}%</span>
    <span class="meta">${hm(t.opened_at)} → ${hm(t.closed_at)} · ${esc(t.reason)} · ${num(t.notional)} USDT</span></div>`).join('');
}

function render(preserve = false) {
  S = {...D.accounts[account], now: D.updated};
  header(); position();
  if (!chart) buildChart();
  chartData(preserve); lower();
}

function validate(data, rows) {
  if (!Number.isFinite(data.updated) || !data.health || !Array.isArray(data.health.down) || !data.marks || !data.accounts || !Array.isArray(data.signals?.rows) || !Array.isArray(data.signals.flow)) throw Error('invalid data');
  const numbers = (item, keys) => keys.every(k => Number.isFinite(item[k]));
  if (!numbers(data.health, ['ok','total']) || !data.health.down.every(s => typeof s === 'string')) throw Error('invalid health');
  for (const name of ['paper', 'practice']) {
    const a = data.accounts[name];
    if (!a || !Array.isArray(a.positions) || !Array.isArray(a.closed) || !numbers(a, ['equity','day_pnl','realized','trades','wins'])) throw Error('invalid account');
    if (![...a.positions, ...a.closed].every(p => ['long', 'short'].includes(p.side) && SYMBOLS.includes(p.symbol) && Array.isArray(p.fills) && numbers(p, ['size','entry','notional','pnl','pnl_pct','opened_at','target','stop','signal_time']))) throw Error('invalid position');
    if (!a.positions.every(p => numbers(p, ['mark','leverage','decision_time','max_hold_at','ladder_filled','ladder_steps']) && Array.isArray(p.pending) && p.pending.every(Number.isFinite))) throw Error('invalid open position');
    if (!a.closed.every(t => numbers(t, ['exit','closed_at']) && typeof t.reason === 'string')) throw Error('invalid trade');
    if (a.orders && (!Array.isArray(a.orders) || !a.orders.every(o => numbers(o, ['time','price','size']) && SYMBOLS.includes(o.symbol)))) throw Error('invalid orders');
  }
  if (!data.signals.rows.every(r => typeof r.name === 'string' && typeof r.on === 'boolean' && (!r.last || (numbers(r.last, ['time','result_time']) && ['long','short'].includes(r.last.side) && typeof r.last.result === 'string')))) throw Error('invalid signals');
  if (!data.signals.flow.every(r => typeof r.step === 'string' && Number.isFinite(r.time))) throw Error('invalid flow');
  if (data.signals.dots && (!Array.isArray(data.signals.dots) || !data.signals.dots.every(r => SYMBOLS.includes(r.symbol) && Number.isFinite(r.time)))) throw Error('invalid dots');
  for (const s of SYMBOLS) {
    if (!Array.isArray(rows[s]) || !rows[s].length || !rows[s].every((r, i) => r.length === 6 && r.every(Number.isFinite) && (!i || r[0] - rows[s][i - 1][0] === 60))) throw Error('invalid candles');
  }
}

async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try {
    const stamp = Date.now();
    const [data, rows] = await Promise.all(['data.json', 'candles.json'].map(async name => {
      const response = await fetch(`${name}?v=${stamp}`, {cache: 'no-store', signal: AbortSignal.timeout(15000)});
      if (!response.ok) throw Error('fetch failed');
      return response.json();
    }));
    validate(data, rows);
    D = data; C = rows; failed = false;
    render(true);
  } catch {
    failed = true;
    if (!D) el('pos').innerHTML = '<div class="muted">자료를 기다리는 중</div>';
  } finally { refreshing = false; status(); }
}
refresh();
setInterval(refresh, 60000);
setInterval(status, 10000);
</script>
